<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="80" y1="80" x2="740" y2="80"/>
    <line x1="80" y1="140" x2="740" y2="140"/>
    <line x1="80" y1="200" x2="740" y2="200"/>
    <line x1="80" y1="260" x2="740" y2="260"/>
    <line x1="80" y1="320" x2="740" y2="320"/>
    
    <line x1="160" y1="60" x2="160" y2="340"/>
    <line x1="280" y1="60" x2="280" y2="340"/>
    <line x1="400" y1="60" x2="400" y2="340"/>
    <line x1="520" y1="60" x2="520" y2="340"/>
    <line x1="640" y1="60" x2="640" y2="340"/>
  </g>

  <!-- Header Pill & Title -->
  <rect x="80" y="40" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="95" cy="54" r="5" fill="#10b981"/>
  <text x="110" y="59" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TSLA • Predictive Trend Model</text>

  <!-- Stats Box 1 -->
  <rect x="520" y="36" width="105" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="532" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">DIRECTION ACCURACY</text>
  <text x="532" y="64" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">82.4%</text>

  <!-- Stats Box 2 -->
  <rect x="635" y="36" width="105" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="647" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">MODEL TYPE</text>
  <text x="647" y="64" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Logistic Reg.</text>

  <!-- Chart Area fill -->
  <path d="M 80 300 Q 150 290 200 240 T 320 220 T 420 180 T 540 130 T 640 150 T 740 90 L 740 340 L 80 340 Z" fill="url(#areaGrad)"/>

  <!-- Moving average secondary line -->
  <path d="M 80 310 Q 150 300 200 260 T 320 245 T 420 210 T 540 165 T 640 170 T 740 120" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- Main Trend Line with Glow -->
  <path d="M 80 300 Q 150 290 200 240 T 320 220 T 420 180 T 540 130 T 640 150 T 740 90" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Data Points -->
  <circle cx="200" cy="240" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="320" cy="220" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="420" cy="180" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
  <circle cx="540" cy="130" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="640" cy="150" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="740" cy="90" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Prediction Tooltip Callout -->
  <g transform="translate(620, 80)">
    <rect x="0" y="-35" width="120" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="10" y="-15" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">▲ Bullish Signal</text>
  </g>

  <!-- Bottom Labels / Timeline -->
  <g fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    <text x="160" y="365">Jan</text>
    <text x="280" y="365">Feb</text>
    <text x="400" y="365">Mar</text>
    <text x="520" y="365">Apr</text>
    <text x="640" y="365">May</text>
    <text x="730" y="365">Jun</text>
  </g>

  <!-- Tags at bottom -->
  <g transform="translate(80, 395)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="42" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pandas EDA</text>

    <rect x="95" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="147" y="17" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Feature Eng.</text>

    <rect x="210" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="267" y="17" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Matplotlib/Seaborn</text>

    <rect x="335" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="402" y="17" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Logistic Regression</text>
  </g>
</svg>